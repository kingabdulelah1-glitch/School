<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b18"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Smart Study Countdown</title>
<style>
:root{--bg:#050b18;--g:rgba(255,255,255,.07);--gb:rgba(255,255,255,.14);--tx:#eaf6ff;--mu:#8fb0c8;--ac:#38bdf8;--ac2:#0ea5e9;--ok:#34d399;--bad:#f87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 500px at 80% -10%,#0b3a63 0,transparent 60%),radial-gradient(700px 500px at 0 100%,#07294a 0,transparent 60%),var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;min-height:100vh}
nav{width:210px;padding:18px 12px;display:flex;flex-direction:column;gap:6px;background:var(--g);backdrop-filter:blur(16px);border-inline-end:1px solid var(--gb);position:sticky;top:0;height:100vh}
nav h1{font-size:15px;margin:0 8px 14px;color:var(--ac)}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:12px;color:var(--mu);display:flex;gap:10px;align-items:center;font-size:14px;transition:.2s}
nav button:hover{background:var(--g);color:var(--tx)}nav button.on{background:linear-gradient(135deg,var(--ac2),#2563eb);color:#fff;box-shadow:0 6px 20px rgba(14,165,233,.35)}
main{flex:1;padding:22px;max-width:1000px;margin:auto;width:100%;min-width:0}
.card{background:var(--g);border:1px solid var(--gb);border-radius:18px;padding:16px;backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1);transition:transform .25s,box-shadow .25s;animation:in .4s both}
.card:hover{transform:perspective(700px) translateY(-3px) rotateX(2deg);box-shadow:0 16px 40px rgba(14,165,233,.2)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.mt{margin-top:14px}
h2{margin:0 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:13px;color:var(--mu);font-weight:600}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ac);text-shadow:0 0 22px rgba(56,189,248,.5)}
.clock{font-size:42px}.mu{color:var(--mu);font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:8px;border-inline-start:4px solid var(--c,var(--ac))}
.row>div{flex:1;min-width:0}.row b{display:block}
.btn{cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:linear-gradient(135deg,var(--ac2),#2563eb);color:#fff;font-size:13px}
.btn.s{background:var(--g);border:1px solid var(--gb);color:var(--tx)}.btn.d{background:rgba(248,113,113,.2);color:var(--bad)}.ic{padding:5px 9px}
input,select,textarea{background:rgba(255,255,255,.07);border:1px solid var(--gb);color:var(--tx);border-radius:10px;padding:8px;font:inherit;width:100%}
input[type=color]{padding:2px;height:36px}input[type=checkbox]{width:auto}option{background:#0b1b30}
label{font-size:12px;color:var(--mu);display:block}.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f .w{grid-column:1/-1}
dialog{background:#0a1a2e;color:var(--tx);border:1px solid var(--gb);border-radius:18px;width:min(460px,94vw);padding:18px}dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ok));transition:width .6s}
.wk{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow-x:auto}.wk>div{min-width:0}.wk .row{font-size:12px;display:block}.wk h3{text-align:center}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
#toasts{position:fixed;top:12px;inset-inline-end:12px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:linear-gradient(135deg,#0369a1,#1d4ed8);padding:12px 16px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:in .3s}
.done{opacity:.5;text-decoration:line-through}
html,body{-webkit-tap-highlight-color:transparent;overflow-x:hidden}
@media(hover:none){.card:hover{transform:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}}
@media(max-width:700px){:root{padding-bottom:0}body{flex-direction:column-reverse}nav{width:100%;height:auto;flex-direction:row;position:sticky;bottom:0;z-index:50;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;border-inline-end:0;border-top:1px solid var(--gb);background:rgba(8,18,36,.92)}nav h1{display:none}nav button{flex:1;min-width:58px;min-height:50px;justify-content:center;flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;white-space:nowrap;text-align:center}nav button span{font-size:18px}main{padding:14px 12px 20px}h2{font-size:18px}.big{font-size:28px}.clock{font-size:34px}.grid{grid-template-columns:1fr}.wk{grid-template-columns:1fr;overflow:visible}.btn{min-height:40px;padding:9px 14px}.btn.ic{min-width:38px}input,select,textarea{font-size:16px;min-height:42px}input[type=checkbox]{width:20px;height:20px;min-height:0}.row{padding:12px}.top .btn{flex:1}dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}#toasts{inset-inline:10px;top:calc(10px + env(safe-area-inset-top,0px))}}
@media(max-width:400px){.f{grid-template-columns:1fr}}
</style></head><body>
<nav id="nav"></nav><main id="main"></main><div id="toasts"></div><dialog id="dlg"></dialog>
<script>
const K='ssc_v1';
const D={ar:{app:'عداد الدراسة الذكي',dash:'لوحة التحكم',sched:'جدولي',cal:'التقويم',exams:'الاختبارات والواجبات',notif:'التنبيهات',set:'الإعدادات',next:'الحصة القادمة',cur:'الحصة الحالية',endsIn:'تنتهي بعد',startsIn:'تبدأ بعد',today:'جدول اليوم',left:'حصص متبقية اليوم',near:'أقرب اختبار أو واجب',prog:'إنجاز المهام',add:'إضافة',type:'النوع',class:'حصة',exam:'اختبار',assignment:'واجب',project:'مشروع',title:'اسم المادة / العنوان',teacher:'المعلم (اختياري)',loc:'القاعة / الموقع',color:'اللون',date:'التاريخ',start:'البداية / وقت التسليم',end:'النهاية',repeat:'تكرار أسبوعي',save:'حفظ',cancel:'إلغاء',del:'حذف',edit:'تعديل',hol:'الإجازات',holName:'اسم الإجازة',from:'من',to:'إلى',none:'لا يوجد شيء بعد — أضف أول عنصر!',perm:'تفعيل إشعارات المتصفح',test:'تجربة تنبيه',lang:'اللغة',sound:'تنبيه صوتي',offs:'دقائق التنبيه (مفصولة بفاصلة)',reset:'مسح كل البيانات',week:'أسبوعي',day:'يومي',log:'سجل التنبيهات',nolog:'لا توجد تنبيهات بعد',now:'بدأت الحصة',mins:'دقيقة',soon:'تبدأ بعد',backup:'نسخة احتياطية (JSON)',load:'استيراد',hint:'للإشعارات والتنبيه أثناء إغلاق الموقع يلزم PWA وخادم Push، والإشعارات هنا تعمل والصفحة مفتوحة.',ds:'ي',hs:'س',ms:'د',ss:'ث',over:'انتهى',today2:'اليوم',wd:'حصص متكررة أسبوعياً',confirm:'هل أنت متأكد؟',days:'أيام الأسبوع (تتكرر الحصة فيها)',gridT:'الجدول الأسبوعي (اضغط على أي خانة)',ldtt:'تحميل جدولي من الصورة',period:'الحصة',brk:'الفسحة',pray:'صلاة'},
en:{app:'Smart Study Countdown',dash:'Dashboard',sched:'My Schedule',cal:'Calendar',exams:'Exams & Assignments',notif:'Notifications',set:'Settings',next:'Next class',cur:'Current class',endsIn:'Ends in',startsIn:'Starts in',today:'Today’s schedule',left:'Classes left today',near:'Nearest exam or assignment',prog:'Task completion',add:'Add',type:'Type',class:'Class',exam:'Exam',assignment:'Assignment',project:'Project',title:'Subject / title',teacher:'Teacher (optional)',loc:'Room / location',color:'Color',date:'Date',start:'Start / due time',end:'End',repeat:'Repeat weekly',save:'Save',cancel:'Cancel',del:'Delete',edit:'Edit',hol:'Holidays',holName:'Holiday name',from:'From',to:'To',none:'Nothing yet — add your first item!',perm:'Enable browser notifications',test:'Test alert',lang:'Language',sound:'Sound alerts',offs:'Alert minutes (comma separated)',reset:'Erase all data',week:'Week',day:'Day',log:'Alert log',nolog:'No alerts yet',now:'Class started',mins:'min',soon:'starts in',backup:'Backup (JSON)',load:'Import',hint:'Alerts while the site is closed need a PWA and a push server; notifications here work while the page is open.',ds:'d',hs:'h',ms:'m',ss:'s',over:'Done',today2:'Today',wd:'Weekly recurring classes',confirm:'Are you sure?',days:'Weekdays (class repeats on these)',gridT:'Weekly timetable (tap any cell)',ldtt:'Load my timetable from the photo',period:'Period',brk:'Break',pray:'Prayer'}};
let S=(()=>{try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}})()||{};
const DP=[['07:30','08:15'],['08:17','09:02'],['09:03','09:47'],['09:48','10:33'],['10:53','11:33'],['11:33','12:13'],['12:13','12:53'],['13:00','13:40']];
S.items=S.items||[];S.hols=S.hols||[];S.per=S.per||DP;S.set=Object.assign({lang:'ar',sound:true,mins:[30,10,5]},S.set);
let V={page:'dash',cv:innerWidth<700?'day':'week',cd:new Date(),log:[]},fired={};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const t=k=>D[S.set.lang][k]||k,L=()=>S.set.lang==='ar'?'ar-u-nu-latn':'en';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),ds=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const at=(k,h)=>new Date(k+'T'+(h||'00:00')),wdy=k=>new Date(k+'T00:00').getDay();
const fT=d=>d.toLocaleTimeString(L(),{hour:'2-digit',minute:'2-digit'});
const hol=k=>S.hols.some(h=>h.from<=k&&k<=h.to);
const dys=it=>it.days&&it.days.length?it.days:[wdy(it.date)];
const occ=(it,k)=>it.type==='class'&&it.repeat?(k>=it.date&&dys(it).includes(wdy(k))):it.date===k;
function evs(n,from){const o=[],b=new Date(from||new Date());b.setHours(0,0,0,0);for(let i=0;i<n;i++){const d=new Date(b);d.setDate(b.getDate()+i);const k=ds(d),h=hol(k);S.items.forEach(it=>{if(!occ(it,k)||(h&&it.type==='class'))return;o.push({it,k,s:at(k,it.start),e:at(k,it.end||it.start)})})}return o.sort((a,b)=>a.s-b.s)}
function cdTxt(ms){if(ms<=0)return'—';let s=Math.floor(ms/1e3),d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return(d?d+t('ds')+' ':'')+p2(h)+t('hs')+' '+p2(m)+t('ms')+' '+p2(s)+t('ss')}
const cd=ts=>`<span data-cd="${ts}"></span>`;
const ic={dash:'◈',sched:'▤',cal:'▦',exams:'✎',notif:'🔔',set:'⚙'};
function nav(){$('#nav').innerHTML='<h1>📚 '+t('app')+'</h1>'+Object.keys(ic).map(k=>`<button data-a="pg" data-v="${k}" class="${V.page===k?'on':''}"><span>${ic[k]}</span>${t(k)}</button>`).join('')}
const $=s=>document.querySelector(s);
function row(x,o={}){const it=x.it,c=esc(it.color||'#38bdf8');return`<div class="row" data-a="ed" data-id="${it.id}" style="--c:${c};cursor:pointer"><div class="${it.done?'done':''}"><b>${it.type!=='class'?'['+t(it.type)+'] ':''}${esc(it.title)}</b><span class="mu">${o.date?x.k+' · ':''}${fT(x.s)}${it.type==='class'?' – '+fT(x.e):''}${it.loc?' · '+esc(it.loc):''}${it.teacher?' · '+esc(it.teacher):''}</span></div>${o.cd?`<span class="mu">${cd(x.s.getTime())}</span>`:''}${o.act?`<button class="btn s ic" data-a="ed" data-id="${it.id}">✎</button><button class="btn d ic" data-a="rm" data-id="${it.id}">✕</button>`:''}</div>`}
function dash(){const now=new Date(),ev=evs(45),cls=ev.filter(x=>x.it.type==='class'),cur=cls.find(x=>x.s<=now&&now<x.e),nx=cls.find(x=>x.s>now),td=ev.filter(x=>x.k===ds(now)),left=td.filter(x=>x.it.type==='class'&&x.s>now).length,tk=ev.filter(x=>x.it.type!=='class'&&!x.it.done&&x.e>now)[0],all=S.items.filter(i=>i.type!=='class'),dn=all.filter(i=>i.done).length,pc=all.length?Math.round(dn/all.length*100):0;
return`<div class="grid"><div class="card"><h3>${now.toLocaleDateString(L(),{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</h3><div class="big clock" id="clk"></div></div>
<div class="card"><h3>${cur?t('cur')+' — '+esc(cur.it.title):t('next')+(nx?' — '+esc(nx.it.title):'')}</h3>${cur?`<div class="mu">${t('endsIn')}</div><div class="big">${cd(cur.e.getTime())}</div>`:nx?`<div class="mu">${t('startsIn')} · ${nx.k} ${fT(nx.s)}</div><div class="big">${cd(nx.s.getTime())}</div>`:'<div class="mu">—</div>'}</div></div>
<div class="grid mt"><div class="card"><h3>${t('left')}</h3><div class="big">${left}</div></div><div class="card"><h3>${t('near')}</h3>${tk?`<b>${esc(tk.it.title)}</b><div class="big" style="font-size:24px">${cd(tk.s.getTime())}</div>`:'<div class="mu">—</div>'}</div><div class="card"><h3>${t('prog')} ${pc}%</h3><div class="bar"><i style="width:${pc}%"></i></div><div class="mu mt">${dn}/${all.length}</div></div></div>
<div class="card mt"><h2>${t('today')}</h2>${td.length?td.map(x=>row(x,{cd:1})).join(''):`<div class="mu">${S.items.length?'—':t('none')}</div>`}<button class="btn mt" data-a="add" data-v="class">＋ ${t('add')}</button></div>`}
function sched(){const cl=S.items.filter(i=>i.type==='class'&&!i.slot).sort((a,b)=>a.start.localeCompare(b.start));
let h=`<div class="top"><h2>${t('sched')}</h2><button class="btn" data-a="add" data-v="class">＋ ${t('add')}</button></div>`;
h+=grid();
for(let d=0;d<7;d++){const day=new Date(2024,0,7+d).toLocaleDateString(L(),{weekday:'long'}),xs=cl.filter(i=>i.repeat&&dys(i).includes(d));if(xs.length)h+=`<div class="card mt"><h3>${day}</h3>${xs.map(i=>row({it:i,k:i.date,s:at(i.date,i.start),e:at(i.date,i.end)},{act:1})).join('')}</div>`}
const one=cl.filter(i=>!i.repeat);if(one.length)h+=`<div class="card mt"><h3>${t('class')}</h3>${one.map(i=>row({it:i,k:i.date,s:at(i.date,i.start),e:at(i.date,i.end)},{act:1,date:1})).join('')}</div>`;

h+=`<div class="card mt"><h2>${t('hol')}</h2><div class="f"><div class="w"><label>${t('holName')}</label><input id="hn"></div><div><label>${t('from')}</label><input type="date" id="hf"></div><div><label>${t('to')}</label><input type="date" id="ht"></div></div><button class="btn mt" data-a="addh">＋ ${t('add')}</button><div class="mt">${S.hols.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><span class="mu">${x.from} → ${x.to}</span></div><button class="btn d ic" data-a="rmh" data-id="${x.id}">✕</button></div>`).join('')}</div></div>`;return h}
function cal(){const d=new Date(V.cd),h=`<div class="top"><h2>${t('cal')}</h2><div><button class="btn s" data-a="cv" data-v="week">${t('week')}</button> <button class="btn s" data-a="cv" data-v="day">${t('day')}</button> <button class="btn s" data-a="cn" data-v="-1">‹</button><button class="btn s" data-a="cn" data-v="0">${t('today2')}</button><button class="btn s" data-a="cn" data-v="1">›</button> <button class="btn" data-a="add" data-v="class">＋</button></div></div>`;
const days=V.cv==='day'?1:7;let st=new Date(d);if(V.cv==='week')st.setDate(d.getDate()-d.getDay());const e=evs(days,st);
const cols=[...Array(days)].map((_,i)=>{const x=new Date(st);x.setDate(st.getDate()+i);const k=ds(x),hh=hol(k);return`<div class="card" style="padding:10px"><h3>${x.toLocaleDateString(L(),{weekday:'short',day:'numeric',month:'short'})}${hh?' 🏖':''}</h3>${e.filter(y=>y.k===k).map(y=>row(y,{act:V.cv==='day'})).join('')||'<div class="mu">·</div>'}</div>`}).join('');
return h+`<div class="${V.cv==='week'?'wk':''}">${cols}</div>`}
function exams(){const xs=evs(400).filter(x=>x.it.type!=='class'),past=S.items.filter(i=>i.type!=='class'&&!xs.some(x=>x.it===i)).map(i=>({it:i,k:i.date,s:at(i.date,i.start),e:at(i.date,i.start)})),all=[...past,...xs].sort((a,b)=>a.s-b.s);
return`<div class="top"><h2>${t('exams')}</h2><span><button class="btn" data-a="add" data-v="exam">＋ ${t('exam')}</button> <button class="btn" data-a="add" data-v="assignment">＋ ${t('assignment')}</button> <button class="btn" data-a="add" data-v="project">＋ ${t('project')}</button></span></div>`+(all.length?all.map(x=>`<div class="row" style="--c:${esc(x.it.color)}"><input type="checkbox" data-a="dn" data-id="${x.it.id}" ${x.it.done?'checked':''}><div class="${x.it.done?'done':''}"><b>[${t(x.it.type)}] ${esc(x.it.title)}</b><span class="mu">${x.k} ${fT(x.s)}${x.it.loc?' · '+esc(x.it.loc):''}</span></div><span class="big" style="font-size:16px">${x.it.done?'✓':cd(x.s.getTime())}</span><button class="btn s ic" data-a="ed" data-id="${x.it.id}">✎</button><button class="btn d ic" data-a="rm" data-id="${x.it.id}">✕</button></div>`).join(''):`<div class="card mu">${t('none')}</div>`)}
function notif(){const ok='Notification'in window;return`<h2>${t('notif')}</h2><div class="card"><button class="btn" data-a="perm">${t('perm')}${ok?' ('+Notification.permission+')':''}</button> <button class="btn s" data-a="test">${t('test')}</button><p class="mu">${t('hint')}</p></div><div class="card mt"><h3>${t('log')}</h3>${V.log.map(l=>`<div class="row"><div>${esc(l)}</div></div>`).join('')||`<div class="mu">${t('nolog')}</div>`}</div>`}
function settings(){return`<h2>${t('set')}</h2><div class="card"><div class="f"><div><label>${t('lang')}</label><select id="sl"><option value="ar" ${S.set.lang==='ar'?'selected':''}>العربية</option><option value="en" ${S.set.lang==='en'?'selected':''}>English</option></select></div><div><label>${t('offs')}</label><input id="so" value="${S.set.mins.join(',')}"></div><div class="w"><label><input type="checkbox" id="ss" ${S.set.sound?'checked':''}> ${t('sound')}</label></div></div></div><div class="card mt"><label>${t('backup')}</label><textarea id="bk" rows="4">${esc(JSON.stringify({items:S.items,hols:S.hols}))}</textarea><button class="btn s mt" data-a="imp">${t('load')}</button></div><div class="card mt"><button class="btn d" data-a="wipe">${t('reset')}</button></div>`}
function render(){document.documentElement.lang=S.set.lang;document.documentElement.dir=S.set.lang==='ar'?'rtl':'ltr';nav();$('#main').innerHTML=({dash,sched,cal,exams,notif,set:settings})[V.page]();tick()}
const TT=[['linguistic Competences2|محمد قرين','Physics|عز الدين','Precalculus|إسلام عبد الروف','Chemistry|وليد طلعت','Biology|مصطفى إبراهيم','Monotheism|عمر باحكيم','English literature|أحمد صالح','French|صلاح الدين محمد'],['linguistic Competences2|محمد قرين','Robotics|محمد عبد اللطيف','Biology|مصطفى إبراهيم','Art and Design|العجمي','Precalculus|إسلام عبد الروف','Physical Education|علي عسيري','English literature|أحمد صالح','Jurisprudence|عمر باحكيم'],['Business|سمير هنداوي','Robotics|محمد عبد اللطيف','Precalculus|إسلام عبد الروف','Chemistry|وليد طلعت','English literature|أحمد صالح','Physics|عز الدين','French|صلاح الدين محمد','Biology|مصطفى إبراهيم'],['Robotics|محمد عبد اللطيف','Business|سمير هنداوي','Physics|عز الدين','Chemistry|وليد طلعت','English literature|أحمد صالح','Precalculus|إسلام عبد الروف','History 1|مراد الحاشي','linguistic Competences2|محمد قرين'],['Jurisprudence|عمر باحكيم','English literature|أحمد صالح','Monotheism|عمر باحكيم','English literature|أحمد صالح','Precalculus|إسلام عبد الروف','Business|سمير هنداوي','Precalculus|إسلام عبد الروف','']];
const col=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;const f=n=>{const k=(n+h/30)%12;return Math.round(255*(.6-.3*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};return'#'+f(0)+f(8)+f(4)};
const slotIt=(d,p)=>S.items.find(i=>i.slot===d+'-'+p);
const mkSlot=(d,p,ti,te,lo,co,id)=>({id,type:'class',title:ti,teacher:te,loc:lo,color:co,date:'2020-01-01',start:S.per[p][0],end:S.per[p][1],repeat:true,days:[d],slot:d+'-'+p});
function loadTT(){TT.forEach((r,d)=>r.forEach((c,p)=>{if(!c)return;const[a,b]=c.split('|');S.items=S.items.filter(i=>i.slot!==d+'-'+p);S.items.push(mkSlot(d,p,a,b,'',col(a),'tt'+d+p))}));save()}
function grid(){const P=[0,1,2,3,'b',4,5,6,'p',7],has=S.items.some(i=>i.slot),ti='style="width:78px;padding:2px;font-size:11px;min-height:0"';
let h=`<div class="card mt" style="overflow-x:auto"><div class="top"><h3>${t('gridT')}</h3>${has?'':`<button class="btn" data-a="ldtt">${t('ldtt')}</button>`}</div><table style="border-collapse:separate;border-spacing:4px;min-width:780px;width:100%"><tr><th></th>${P.map(p=>p==='b'||p==='p'?`<th class="mu" style="font-size:11px;width:44px">${t(p==='b'?'brk':'pray')}</th>`:`<th><div class="mu" style="font-size:11px">${t('period')} ${p+1}</div><input type="time" data-per="${p}" data-k="0" value="${S.per[p][0]}" ${ti}><input type="time" data-per="${p}" data-k="1" value="${S.per[p][1]}" ${ti}></th>`).join('')}</tr>`;
for(let d=0;d<5;d++)h+=`<tr><th style="white-space:nowrap;padding:0 6px">${new Date(2024,0,7+d).toLocaleDateString(L(),{weekday:'long'})}</th>`+P.map(p=>{if(p==='b'||p==='p')return'<td style="background:rgba(255,255,255,.03);border-radius:8px"></td>';const i=slotIt(d,p);return`<td data-a="cell" data-d="${d}" data-p="${p}" style="cursor:pointer;vertical-align:top;border-radius:10px;padding:6px;min-width:86px;height:64px;background:rgba(255,255,255,${i?.08:.03});border:1px solid var(--gb);${i?'border-top:3px solid '+esc(i.color):''}">${i?`<b style="font-size:12px">${esc(i.title)}</b><div class="mu" style="font-size:10px">${esc(i.teacher)}</div>`:'<span class="mu">＋</span>'}</td>`}).join('')+'</tr>';
return h+'</table></div>'}
function cellForm(d,p){const i=slotIt(d,p)||{title:'',teacher:'',loc:'',color:'#38bdf8'};$('#dlg').innerHTML=`<h2>${new Date(2024,0,7+d).toLocaleDateString(L(),{weekday:'long'})} · ${t('period')} ${p+1}</h2><div class="f"><div class="w"><label>${t('title')}</label><input id="c_t" value="${esc(i.title)}"></div><div class="w"><label>${t('teacher')}</label><input id="c_te" value="${esc(i.teacher)}"></div><div><label>${t('loc')}</label><input id="c_l" value="${esc(i.loc)}"></div><div><label>${t('color')}</label><input type="color" id="c_c" value="${i.color}"></div></div><div class="top mt"><button class="btn" data-a="cs" data-d="${d}" data-p="${p}">${t('save')}</button>${i.id?`<button class="btn d" data-a="rm" data-id="${i.id}">${t('del')}</button>`:''}<button class="btn s" data-a="cl">${t('cancel')}</button></div>`;$('#dlg').showModal()}
function saveCell(d,p){const ti=$('#c_t').value.trim(),o=slotIt(d,p);if(!ti){if(o)S.items=S.items.filter(x=>x!==o)}else{const c=$('#c_c').value,n=mkSlot(d,p,ti,$('#c_te').value,$('#c_l').value,(!o&&c==='#38bdf8')?col(ti):c,o?o.id:'i'+Date.now()+d+p);o?Object.assign(o,n):S.items.push(n)}save();$('#dlg').close();render()}
let pend=null;function ask(cb){pend=cb;$('#dlg').innerHTML=`<h2>${t('confirm')}</h2><div class="top mt"><button class="btn d" data-a="yes">${t('del')}</button><button class="btn s" data-a="cl">${t('cancel')}</button></div>`;try{$('#dlg').showModal()}catch(e){$('#dlg').setAttribute('open','')}}
function form(it,type){const i=it||{id:'',type,title:'',teacher:'',loc:'',color:'#38bdf8',date:ds(new Date()),start:'08:00',end:'09:00',repeat:type==='class'};const c=i.type==='class';
$('#dlg').innerHTML=`<h2>${t(i.type)}</h2><div class="f"><div class="w"><label>${t('title')}</label><input id="f_title" value="${esc(i.title)}"></div>${c?`<div class="w"><label>${t('teacher')}</label><input id="f_teacher" value="${esc(i.teacher)}"></div>`:''}<div><label>${t('date')}</label><input type="date" id="f_date" value="${i.date}"></div><div><label>${t('loc')}</label><input id="f_loc" value="${esc(i.loc)}"></div><div><label>${t('start')}</label><input type="time" id="f_start" value="${i.start}"></div>${c?`<div><label>${t('end')}</label><input type="time" id="f_end" value="${i.end}"></div>`:''}<div><label>${t('color')}</label><input type="color" id="f_color" value="${i.color}"></div>${c?`<div><label><input type="checkbox" id="f_repeat" ${i.repeat?'checked':''}> ${t('repeat')}</label></div><div class="w"><label>${t('days')}</label><div style="display:flex;gap:6px;flex-wrap:wrap">${[6,0,1,2,3,4,5].map(d=>`<label style="display:flex;gap:4px;align-items:center;padding:6px 10px;border:1px solid var(--gb);border-radius:10px;color:var(--tx);cursor:pointer"><input type="checkbox" class="fd" value="${d}" ${dys(i).includes(d)?'checked':''}>${new Date(2024,0,7+d).toLocaleDateString(L(),{weekday:'short'})}</label>`).join('')}</div></div>`:''}</div><div class="top mt"><button class="btn" data-a="sv" data-id="${i.id}" data-v="${i.type}">${t('save')}</button>${i.id?`<button class="btn d" data-a="rm" data-id="${i.id}">${t('del')}</button>`:''}<button class="btn s" data-a="cl">${t('cancel')}</button></div>`;$('#dlg').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,id=b.dataset.id;
if(a==='pg'){V.page=v;render()}else if(a==='add')form(null,v);else if(a==='cell')cellForm(+b.dataset.d,+b.dataset.p);else if(a==='cs')saveCell(+b.dataset.d,+b.dataset.p);else if(a==='ldtt'){loadTT();render()}else if(a==='cl')$('#dlg').close();
else if(a==='ed')form(S.items.find(i=>i.id===id));
else if(a==='sv'){const g=x=>($('#f_'+x)||{}).value,title=(g('title')||'').trim();if(!title){$('#f_title').focus();return}const o={id:id||'i'+Date.now(),type:v,title,teacher:g('teacher')||'',loc:g('loc')||'',color:g('color'),date:g('date'),start:g('start')||'00:00',end:g('end')||g('start')||'00:00',repeat:v==='class'&&$('#f_repeat').checked,days:v==='class'?[...document.querySelectorAll('.fd:checked')].map(x=>+x.value):[],done:(S.items.find(i=>i.id===id)||{}).done||false};const ix=S.items.findIndex(i=>i.id===id);ix>=0?S.items[ix]=o:S.items.push(o);save();$('#dlg').close();render()}
else if(a==='rm'){ask(()=>{S.items=S.items.filter(i=>i.id!==id);save();render()})}
else if(a==='addh'){const n=$('#hn').value.trim(),f=$('#hf').value,to=$('#ht').value||f;if(n&&f){S.hols.push({id:'h'+Date.now(),name:n,from:f,to});save();render()}}
else if(a==='rmh'){S.hols=S.hols.filter(h=>h.id!==id);save();render()}
else if(a==='dn'){const i=S.items.find(i=>i.id===id);i.done=b.checked;save();render()}
else if(a==='cv'){V.cv=v;render()}else if(a==='cn'){const d=new Date(V.cd),s=V.cv==='day'?1:7;v==='0'?V.cd=new Date():(d.setDate(d.getDate()+s*v),V.cd=d);render()}
else if(a==='perm'){if('Notification'in window)Notification.requestPermission().then(render)}
else if(a==='test')alertUser(t('app'),t('test'))
else if(a==='imp'){try{const o=JSON.parse($('#bk').value);S.items=o.items||[];S.hols=o.hols||[];save();render()}catch(x){alert('JSON?')}}
else if(a==='wipe'){ask(()=>{S.items=[];S.hols=[];save();render()})}else if(a==='yes'){$('#dlg').close();if(pend)pend();pend=null}});
document.addEventListener('change',e=>{const i=e.target.id;if(e.target.dataset.per!==undefined){const p=+e.target.dataset.per;S.per[p][+e.target.dataset.k]=e.target.value;S.items.forEach(x=>{if(x.slot&&+x.slot.split('-')[1]===p){x.start=S.per[p][0];x.end=S.per[p][1]}});save();return}if(i==='sl'){S.set.lang=e.target.value;save();render()}else if(i==='so'){const m=e.target.value.split(',').map(Number).filter(n=>n>0);if(m.length)S.set.mins=m;save()}else if(i==='ss'){S.set.sound=e.target.checked;save()}});
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6);o.start();o.stop(c.currentTime+.6)}catch(e){}}
function alertUser(ti,body){const d=document.createElement('div');d.className='toast';d.innerHTML='<b>'+esc(ti)+'</b><div>'+esc(body)+'</div>';$('#toasts').appendChild(d);setTimeout(()=>d.remove(),8000);V.log.unshift(new Date().toLocaleTimeString(L())+' — '+ti+': '+body);V.log=V.log.slice(0,30);if(S.set.sound)beep();try{if('Notification'in window&&Notification.permission==='granted')new Notification(ti,{body})}catch(e){}if(V.page==='notif')render()}
function checkAlerts(){const now=Date.now();evs(2).forEach(x=>{const df=x.s-now;S.set.mins.forEach(m=>{const k=x.it.id+x.k+m;if(!fired[k]&&df<=m*6e4&&df>m*6e4-9e4&&df>0){fired[k]=1;alertUser(x.it.title,t('soon')+' '+m+' '+t('mins'))}});const k=x.it.id+x.k+'s';if(!fired[k]&&df<=0&&df>-6e4){fired[k]=1;alertUser(x.it.title,x.it.type==='class'?t('now'):t(x.it.type))}})}
let last=0;function tick(){const n=Date.now(),c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString(L());document.querySelectorAll('[data-cd]').forEach(el=>{el.textContent=cdTxt(el.dataset.cd-n)});if(n-last>=1e3){last=n;checkAlerts();const m=new Date().getMinutes()+':'+new Date().getHours();if(tick.m!==m&&!$('dialog[open]')&&['dash'].includes(V.page)){tick.m=m;render()}}}
setInterval(tick,1000);render();
</script></body></html>
